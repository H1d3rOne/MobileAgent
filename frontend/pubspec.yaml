name: mobile_agent
description: AI-Powered Mobile Agent - APK Analysis, Device Control, AI Assistant
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Navigation
  go_router: ^14.2.0
  
  # Network
  dio: ^5.4.0
  web_socket_channel: ^2.4.0
  
  # UI
  flutter_markdown: ^0.7.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  iconsax_flutter: ^1.0.0
  percent_indicator: ^4.2.3
  
  # Code view
  flutter_highlight: ^0.7.0
  
  # File handling
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  
  # Platform
  platform_info: ^4.0.2
  device_info_plus: ^10.1.0
  connectivity_plus: ^6.0.3
  window_manager: ^0.4.2
  
  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utils
  uuid: ^4.4.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  logger: ^2.4.0
  


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
